# Classification des unites du jeu vers la taxonomie interne de roles.
#
# Aucune unite du jeu n'est codee en dur dans le code Python : le classifieur
# applique les regles ci-dessous dans l'ordre, la premiere qui correspond gagne.
#
# Matcheurs disponibles pour `when` (tous ceux presents doivent correspondre) :
#   tags_all      : toutes ces etiquettes doivent etre presentes
#   tags_any      : au moins une de ces etiquettes doit etre presente
#   tags_none     : aucune de ces etiquettes ne doit etre presente
#   key_contains  : au moins un de ces fragments apparait dans l'identifiant d'unite

version: "0.1.0"
default_role: unknown

rules:
  - role: lord
    when:
      tags_any: [lord, general, commander]

  - role: hero_caster
    when:
      tags_any: [hero, agent]
      tags_all: [caster]

  - role: hero_melee
    when:
      tags_any: [hero, agent]

  - role: artillery
    when:
      tags_any: [artillery, siege_engine, cannon]

  - role: flying_unit
    when:
      tags_any: [flying]

  - role: monster
    when:
      tags_any: [monster, monstrous_infantry, giant]

  - role: chariot
    when:
      tags_any: [chariot]

  - role: shock_cavalry
    when:
      tags_any: [cavalry]
      tags_all: [shock]

  - role: light_cavalry
    when:
      tags_any: [cavalry, missile_cavalry]

  - role: ranged_infantry
    when:
      tags_any: [missile, archer, crossbow, handgunner]

  - role: spear_infantry
    when:
      tags_any: [spear, pike, halberd, anti_large]

  - role: support
    when:
      tags_any: [support, healer, buffer]

  - role: melee_infantry
    when:
      tags_any: [melee, infantry, sword, shield]

  # Repli sur l'identifiant lorsqu'aucune etiquette exploitable n'est fournie.
  - role: ranged_infantry
    when:
      key_contains: [archer, crossbow, handgun, gunner, bow]

  - role: artillery
    when:
      key_contains: [cannon, mortar, catapult, ballista, rocket]

  - role: shock_cavalry
    when:
      key_contains: [knight, demigryph, lancer]

  - role: light_cavalry
    when:
      key_contains: [outrider, pistolier, horseman, scout]

  - role: spear_infantry
    when:
      key_contains: [spearman, pikeman, halberdier, spearmen]

  - role: melee_infantry
    when:
      key_contains: [swordsman, warrior, greatsword, axeman]

  # --- Gabarit des identifiants de WARHAMMER III ----------------------------
  #
  # Les cles du jeu suivent la forme `<jeu>_<pack>_<race>_<categorie>_<nom>`,
  # ou la categorie tient en trois lettres. Releve en bataille reelle :
  #
  #   wh3_main_nur_inf_plaguebearers_1      -> inf
  #   wh3_dlc20_chs_cha_daemon_prince_mnur  -> cha
  #
  # Ces regles viennent en **dernier recours** : le segment donne la famille,
  # jamais le detail. Un `_inf_` peut combattre au corps a corps comme au tir,
  # d'ou les regles par nom qui precedent. Quand la sonde saura lire les
  # etiquettes du jeu, ces regles deviendront un filet, pas la source.
  #
  # Deux approximations assumees, choisies pour que l'erreur aille du bon cote :
  #
  # * `_cav_` -> cavalerie de choc : la cavalerie de tir est deja attrapee plus
  #   haut par son nom ; a defaut, la traiter en choc lui interdit les
  #   poursuites lointaines, ce qui est le refus prudent ;
  # * `_cha_` -> seigneur : heros et seigneurs partagent ce segment. Prendre un
  #   heros pour un seigneur lui applique `ProtectLord`, donc plus de
  #   protection que necessaire — jamais moins.

  - role: artillery
    when:
      key_contains: ["_art_"]

  - role: monster
    when:
      key_contains: ["_mon_"]

  - role: chariot
    when:
      key_contains: ["_veh_"]

  - role: shock_cavalry
    when:
      key_contains: ["_cav_"]

  - role: lord
    when:
      key_contains: ["_cha_"]

  - role: melee_infantry
    when:
      key_contains: ["_inf_"]
