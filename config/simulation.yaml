# Parametres du simulateur tactique abstrait.
#
# Ce fichier ne decrit PAS le jeu reel : c'est un modele grossier, volontairement
# simple et deterministe, destine a entrainer et tester l'agent sans WARHAMMER III.

version: "0.1.0"

rules:
  engagement_radius: 12.0      # distance (m) a laquelle deux unites entrent en melee
  charge_duration: 4.0         # duree (s) pendant laquelle le bonus de charge s'applique
  flank_arc_degrees: 100.0     # demi-arc arriere considere comme un flanc/dos
  flank_damage_bonus: 0.5      # multiplicateur de degats supplementaire sur un flanc
  morale_rout_threshold: 0.0   # moral en dessous duquel l'unite deroute
  morale_loss_per_strength: 90.0
  morale_loss_flanked: 4.0
  morale_loss_ally_routed: 6.0
  morale_loss_lord_dead: 20.0
  morale_recovery_per_second: 1.2
  fatigue_move_per_second: 0.010
  fatigue_melee_per_second: 0.022
  fatigue_recovery_per_second: 0.008
  fatigue_damage_penalty: 0.4  # part des degats perdue a fatigue maximale
  damage_jitter: 0.15          # amplitude du bruit aleatoire sur les degats
  rout_speed_multiplier: 1.35

# Valeurs appliquees a tout role qui n'est pas explicitement decrit ci-dessous.
